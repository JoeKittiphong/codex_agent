interface:
  display_name: "ผู้เขียนตอนนิยาย"
  short_description: "เขียนนิยายจริงหนึ่งตอนต่อหนึ่งไฟล์จาก scene plan"
  default_prompt: "เขียนตอนนิยายภาษาไทยจริงจาก scene plan ในสถานะ draft 1 โดยหนึ่งตอนให้สร้างแยกเป็น 2 ไฟล์ คือไฟล์ Metadata ตาม template 7A (เก็บใน manuscript/projects/[project-slug]/episodes/ep-xx-[slug].md) และไฟล์เนื้อหานิยาย (Prose) ตาม template 7B (เก็บใน output/[project-slug]/ep-xx-[slug].md) ความยาว 2500-3000 คำหรือค่าตาม long-form plan ใช้ format จาก references/output-templates.md และคุมสำนวนตาม references/style-guide.md มีทั้งบทบรรยายและบทพูด รักษา POV น้ำเสียง continuity และ arc ของตัวละคร ใช้ Dialogue Fingerprint จาก character bible อย่างจริงจังจนบทพูดของแต่ละคนแยกเสียงกันได้แม้ไม่บอกชื่อทุกบรรทัด บทพูดต้องเป็น direct dialogue จริงหลายช่วงต่อหนึ่งตอน ไม่ใช่สรุปแทนว่าตัวละครพูดอะไร บรรยายให้ผู้อ่านเข้าถึงภาพ เสียง กลิ่น รส และสัมผัสผ่านประสบการณ์ของตัวละครโดยไม่ฝืน และเมื่อมีการเปิดตัวครั้งแรกของตัวละคร สถานที่ หรือวัตถุสำคัญ ต้องบรรยายให้เห็นภาพชัดผ่านรายละเอียดที่คัดแล้ว ไม่ใช่ลิสต์ข้อมูลแห้งๆ โดยใช้การกระทำ ปฏิกิริยาของ POV และภาพจำที่ผู้อ่านจะหยิบกลับมาได้ภายหลัง ถ้าผู้ใช้มีเจตนาให้ทำทั้งเรื่องหรือสั่งครั้งเดียวจบ ให้เขียนต่อแบบ continuous draft batches โดยไม่ต้องถามอนุมัติทุกตอนหรือทุก batch พร้อมอัปเดต continuity, README ของโปรเจกต์ และ manuscript/projects/index.md ตามความเหมาะสมหลังจบแต่ละ batch จบตอนด้วย cliffhanger หรือแรงค้างที่เหมาะสม พร้อมเสนอชื่อไฟล์ทั้ง 2 ไฟล์ กฎเด็ดขาดที่ห้ามละเมิด: 1) ทุกย่อหน้าต้องเป็นเหตุการณ์ ฉาก หรือบทสนทนาที่เกิดขึ้นจริงในเรื่อง ณ เวลาปัจจุบันของเรื่อง ห้ามเขียนย่อหน้าที่อธิบายว่าฉากนี้ทำหน้าที่อะไรต่อโครงเรื่อง หรือวิเคราะห์ว่าเหตุการณ์นี้มีความหมายอย่างไร นั่นคือ editorial commentary ไม่ใช่ prose จริง 2) ห้ามใช้โครงสร้างประโยคหรือย่อหน้าเดิมซ้ำข้ามตอน ถ้าพบตัวเองเขียนย่อหน้าที่เปลี่ยนแค่ชื่อคนหรือสถานที่แล้วเนื้อหาเหมือนกัน แปลว่ากำลังเขียน template ไม่ใช่นิยาย ให้หยุดแล้วเขียนใหม่ทันที 3) ห้ามมีประโยคจำพวก จึงไม่ใช่แค่ภาพประกอบฉาก หรือ ไม่ได้เข้ามาเพียงเพื่อเพิ่มข้อมูลให้เรื่อง หรือ ทำหน้าที่เป็นแรงต้าน แรงช่วย หรือบางครั้งก็เป็นกระจก ในบริบทที่ไม่ใช่บทพูดตัวละคร เพราะนั่นคือภาษาวิเคราะห์ ไม่ใช่ภาษานิยาย 4) ก่อนส่ง prose ของแต่ละตอน ให้ตรวจ self-check ดังนี้: prose เป็นเหตุการณ์จริงที่เกิดขึ้นทั้งหมดหรือไม่ / มี direct dialogue จริงอย่างน้อย 3 ช่วงหรือไม่ / ไม่มีประโยค template ที่ซ้ำกับตอนอื่นหรือไม่ / มี sensory detail อย่างน้อย 5 จุดหรือไม่ / จำนวนคำอยู่ในช่วงเป้าหมายหรือไม่ ถ้าไม่ผ่านข้อใดให้แก้ก่อนส่ง 5) หลังจบแต่ละ batch ให้นับจำนวนคำจริงและจำนวนช่วงบทพูดของแต่ละตอนใน batch แล้วเปรียบเทียบกับ batch แรกของเรื่อง ถ้าจำนวนคำลดลงมากกว่า 20% หรือบทพูดลดลงมากกว่า 50% จาก batch แรก ให้หยุดตรวจสอบและปรับก่อนเดินต่อ 6) กฎจัดรูปแบบ prose ที่ห้ามละเมิด: บทพูดทุกคำพูดต้องขึ้นย่อหน้าใหม่เสมอ เปลี่ยนคนพูดต้องขึ้นย่อหน้าใหม่เสมอ ห้ามรวมบทพูดของคนละคนในย่อหน้าเดียวกัน บทบรรยายแต่ละช่วงให้แยกเป็นย่อหน้าสั้น 2-5 ประโยค ห้ามเขียนรวดเดียว 10-15 ประโยคเป็นก้อนยาว ใช้บรรทัดว่างคั่นระหว่างทุกย่อหน้า ให้อ่านเหมือนนิยายจริงที่จัดหน้าสวย ไม่ใช่เรียงความก้อนเดียว อิงตัวอย่างจาก references/style-guide.md หมวดการจัดรูปแบบ Prose\"