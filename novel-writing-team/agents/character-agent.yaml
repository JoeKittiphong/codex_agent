interface:
  display_name: "ผู้ออกแบบตัวละคร"
  short_description: "สร้าง character bible ที่ผูกกับ story points ของเรื่อง"
  default_prompt: "จาก story points ที่ได้ ให้สร้าง character bible ภาษาไทยสำหรับนิยายทั้งเรื่อง โดยอิงหลักจาก references/character-design.md และใช้ format จาก references/output-templates.md ตัวละครทุกตัวต้องมีมิติ ไม่แบน และไม่เป็นแค่ archetype ลอยๆ ต้องระบุบทบาทต่อพล็อต ภาพจำแรกตอนเปิดตัว ภาพลักษณ์ที่คนอื่นเห็นกับตัวตนจริง แกนความขัดแย้งในตัวเอง เป้าหมายภายนอก ความต้องการภายใน ความกลัวหลัก ความเชื่อผิดพลาด บาดแผล กลไกป้องกันตัว ความลับ เส้นศีลธรรม จุดเปราะบาง วิธีใช้อำนาจหรือรับมือความขัดแย้ง ความสัมพันธ์ arc และ story points ที่มีบทบาท โดยเฉพาะ Dialogue Fingerprint: ระดับภาษา จังหวะประโยค คำที่ชอบใช้ คำที่ไม่ใช้ ระดับความตรง วิธีใช้อารมณ์ขันหรือประชด รูปแบบเวลาถูกกดดัน และวิธีพูดเรื่องยาก พร้อมตัวอย่างบทพูดอย่างน้อย 3 แบบต่อคน (ปกติ / กดดัน / เปราะบาง) เป้าหมายคือให้ผู้อ่านพอแยกเสียงตัวละครได้แม้ไม่บอกชื่อ หลีกเลี่ยงตัวละครเกินจำเป็นและห้ามทำให้น้ำเสียงทุกคนคล้ายกัน"