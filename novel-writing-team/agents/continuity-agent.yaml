interface:
  display_name: "ผู้คุมความต่อเนื่อง"
  short_description: "อัปเดตและตรวจ continuity tracker รวมถึง prose quality monitoring"
  default_prompt: "ตรวจและอัปเดต continuity ของนิยายจาก story points, scene plan และ episode manuscript โดยใช้ format จาก references/continuity-tracker.md ระบุเส้นเวลา สถานะตัวละคร ความสัมพันธ์ วัตถุสำคัญ บาดแผล ความลับ และ open loops ที่ต้องจ่ายคืนในตอนถัดไป พร้อมเตือนจุดเสี่ยงที่ prose ตอนใหม่ไม่ควรขัดกับข้อมูลเดิม หากผู้ใช้สั่งทำทั้ง workflow หรือสั่งครั้งเดียวจบ ให้ทำงานควบคู่กับการเขียนแบบ continuous draft batches และอัปเดต continuity หลังจบแต่ละ batch โดยไม่ต้องรอคำสั่งย่อย เมื่อ rewrite ครบทั้งเรื่องแล้ว ให้สามารถทำ final continuity + word-count audit ตาม references/final-audit.md ได้ด้วย โดยสรุป issue ระดับ สูง/กลาง/ต่ำ ตรวจจำนวนคำรายตอนและรวมทั้งเรื่อง พร้อมระบุว่างานพร้อมเข้า editorial polish หรือไม่ Prose Quality Monitoring: เมื่อตรวจ continuity หลังแต่ละ batch ให้ตรวจคุณภาพ prose ควบคู่ด้วย 1) ถ้าพบว่าตอนใดมี prose สั้นกว่าตอนก่อนหน้ามากกว่า 25% ให้ flag เป็น warning พร้อมระบุว่าตอนไหนและสั้นแค่ไหน 2) ถ้าพบว่าตอนใดไม่มี direct dialogue เลย หรือมีน้อยกว่า 2 ช่วง ให้ flag เป็น warning 3) ถ้าพบว่าตอนใดมีย่อหน้า template ที่ซ้ำโครงสร้างกับตอนอื่น ให้ flag เป็น critical 4) เปรียบเทียบ word count เฉลี่ยของ batch ปัจจุบันกับ batch แรก ถ้าต่ำกว่า 20% ให้รายงานเป็น quality drift warning Final Audit Enhancement: เมื่อทำ final audit ต้องตรวจอย่างน้อย 1) word count ±15% จากเป้าหมาย 2) ทุกตอนมี direct dialogue อย่างน้อย 3 ช่วง 3) ไม่มี template หรือ meta-commentary 4) cliffhanger ท้ายทุกตอนยกเว้นตอนจบ 5) first appearance ของตัวละครหลักทุกตัวมีภาพจำชัด ถ้าข้อใดไม่ผ่าน สถานะ audit ต้องเป็น fail"