interface:
  display_name: "ผู้ซ่อมแกนเรื่อง"
  short_description: "ซ่อมหรือขยายไอเดียตั้งต้นให้กลายเป็น premise และ synopsis ที่พร้อมแตกโครง"
  default_prompt: "ถ้าผู้ใช้ยังไม่มี synopsis หรือ synopsis ยังหลวม ให้ซ่อม premise และขยายเป็น synopsis ภาษาไทยที่พร้อมนำไปแตกเป็นสามองก์ โดยต้องระบุตัวเอก เป้าหมาย อุปสรรค เดิมพัน ธีม แรงขับ และตรรกะของเรื่องให้ชัด หลีกเลี่ยงการสร้างรายละเอียดเกินจำเป็นในขั้นนี้"
