interface:
  display_name: "ทีมเขียนนิยาย"
  short_description: "เปลี่ยน synopsis ให้เป็นนิยายไทยฉบับสมบูรณ์"
  default_prompt: "ใช้ workflow ของทีมเขียนนิยายเพื่อพัฒนาจาก synopsis ไปเป็น three-act, 8 sequences, 27 story points, character bible, style sheet, continuity tracker, scene plan, episode prose ภาษาไทยแบบหนึ่งตอนต่อหนึ่งไฟล์ และ rewrite pass อย่างน้อย 1 รอบ โดยคุมสำนวนให้เข้าถึงภาพ เสียง กลิ่น รส และสัมผัสผ่านประสบการณ์ของตัวละคร สร้างตัวละครให้มีมิติและมี Dialogue Fingerprint แยกเสียงกันได้ชัด และเมื่อมีการเปิดตัวครั้งแรกของคน สถานที่ หรือวัตถุสำคัญ ต้องบรรยายให้คนอ่านเห็นภาพทันทีผ่าน POV ไม่ใช่ลิสต์ข้อมูล ถ้าผู้ใช้สั่งเริ่มครั้งเดียวหรือมีเจตนาให้ทำทั้งเรื่อง ให้เดินต่อแบบ continuous draft -> rewrite -> final audit -> polish โดยไม่ต้องถามซ้ำระหว่าง batch และหากพบปัญหาโครงสร้าง continuity หรือความยาว ให้ตัดสินใจแก้เองแล้วเดินต่อ ห้ามจบข้อความด้วยคำถามว่าให้ทำต่อหรือไม่ ถ้าผู้ใช้ระบุจำนวนตอนหรือ total word target มาให้ใช้ค่านั้นเป็นหลัก ถ้าไม่ได้ระบุ ให้ประเมินขนาดที่เหมาะสมจากความซับซ้อนของ synopsis โดยใช้เกณฑ์จาก references/longform.md: เรื่องสั้น (5-10 ตอน / 15000-30000 คำ) เรื่องขนาดกลาง (12-24 ตอน / 35000-70000 คำ) เรื่องยาว (25-40 ตอน / 75000-120000+ คำ) ล็อกขนาดที่เลือกไว้ใน assumption แล้วเดินต่อ กฎเด็ดขาดเรื่อง prose: 1) ทุกย่อหน้าต้องเป็นเหตุการณ์จริงที่เกิดขึ้นในเรื่อง ห้ามเขียน editorial commentary หรือ meta-analysis ว่าฉากนี้ทำหน้าที่อะไร 2) ห้ามใช้โครงประโยคซ้ำข้ามตอนแบบเปลี่ยนแค่ชื่อ 3) ทุกตอนต้องมี direct dialogue อย่างน้อย 3 ช่วง Quality Gate: เมื่อจบแต่ละขั้นหลัก (draft / rewrite / audit / polish) ให้ตรวจผลลัพธ์จริงก่อนเดินต่อ ถ้าไม่ผ่านให้ย้อนกลับแก้ สูงสุด 2 รอบ สำหรับนิยายมากกว่า 20 ตอน ให้สร้าง internal recap ทุก 10 ตอน"