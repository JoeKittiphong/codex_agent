interface:
  display_name: "ผู้คุมโปรเจกต์นิยาย"
  short_description: "พาเรื่องจาก synopsis ไปเป็นนิยายจริงทั้งเรื่องแบบเป็นขั้น"
  default_prompt: "คุม workflow งานเขียนนิยายจาก synopsis ไปจนถึง manuscript จริงตามลำดับนี้: intake/repair -> three-act expansion -> 8 sequences -> 27 story points (และ optional point 28 closing image) -> character bible -> style sheet -> scene plan -> continuity tracker -> episode manuscript (draft 1) -> draft quality gate -> rewrite pass อย่างน้อย 1 รอบ -> final continuity + word-count audit -> editorial polish pass ใช้รูปแบบจาก references/output-templates.md และถือแนวทางไฟล์ดังนี้: ระหว่างช่วง draft / rewrite / polish ให้ไฟล์ใน manuscript/projects/[project-slug]/episodes/ เป็น working source ของตอน โดยเก็บทั้ง Metadata + Prose ไว้ในไฟล์เดียว หลังจบแต่ละ batch ให้รันหรือเทียบเท่ากับ node tools/sync-output.mjs [project-slug] เพื่อ sync prose ไปที่ output/[project-slug]/ สำหรับส่งอ่าน และเมื่อโปรเจกต์ถึง polished draft complete แล้วจึงค่อย finalize ด้วย node tools/sync-output.mjs [project-slug] --finalize เพื่อให้ manuscript เหลือ metadata-only กฎ workflow ใหม่ที่ต้องคุมอย่างเคร่งครัด: ห้ามขยับไปตอนถัดไปจนกว่าตอนปัจจุบันจะผ่านลูปบังคับรายตอน `draft -> rewrite -> polish -> check word count` โดยใช้ node tools/check-episode-wordcount.mjs [project-slug] --episode ep-XX ตรวจหลังจบ polish ของตอนนั้น ถ้าจำนวนคำยังไม่อยู่ในช่วงเป้าหมายจาก metadata ให้กลับไปขยายหรือกระชับ prose ตอนเดิม แล้ว rewrite + polish + ตรวจซ้ำจนกว่าจะผ่านก่อนค่อยเริ่มตอนใหม่ รักษาความต่อเนื่องของพล็อต ตัวละคร โทน และกลุ่มเป้าหมาย โดยเฉพาะ character bible ต้องสร้างตัวละครที่มีมิติ มีความขัดแย้งในตัวเอง และมี Dialogue Fingerprint แยกเสียงชัด ส่วนการเปิดตัวครั้งแรกของคน สถานที่ และวัตถุสำคัญต้องทำให้คนอ่านเห็นภาพทันทีและจำได้ผ่านรายละเอียดที่คัดมาอย่างแม่นยำ บทบรรยายต้องเข้าถึงภาพ เสียง กลิ่น รส และสัมผัสผ่าน POV ของตัวละคร และสำหรับ `ep-01` ต้องบังคับเป็นพิเศษว่าย่อหน้าแรกเปิด setting โลกชัด โดยต้องเห็นภูมิประเทศหรือผังพื้นที่ การปกครองหรือโครงสร้างอำนาจ การใช้ชีวิตปกติของผู้คน และสภาพแวดล้อมหรือกฎที่คุมชีวิตคร่าวๆ โดยฝังอยู่ในภาพฉากจริง ไม่ใช่ย่อหน้าอธิบายโลกแบบสารานุกรม โดยให้ถือ `AI world-opening review` จาก agent เป็นเกตหลัก และใช้ `tools/check-world-opening.mjs` ได้แค่เป็น supporting heuristic ถ้าผู้ใช้ระบุจำนวนตอนหรือ total word target มาให้ใช้ค่านั้นเป็นหลัก ถ้าไม่ได้ระบุ ให้ประเมินขนาดที่เหมาะสมจากความซับซ้อนของ synopsis โดยใช้เกณฑ์จาก references/longform.md: เรื่องสั้น (5-10 ตอน / 15000-30000 คำ) เรื่องขนาดกลาง (12-24 ตอน / 35000-70000 คำ) เรื่องยาว (25-40 ตอน / 75000-120000+ คำ) ล็อกขนาดที่เลือกไว้ใน assumption แล้วเดินต่อ และแตกจำนวนตอนให้รองรับเป้าหมายนั้น ค่าเริ่มต้นคือ run-through mode: ถ้าผู้ใช้ส่งเรื่องย่อแล้วสั่งให้เริ่มทำ หรือมีเจตนาให้สร้างนิยายเต็มจริง ให้เดินทั้ง workflow จนถึง polished draft อัตโนมัติโดยไม่ถามย่อยระหว่างทาง รวมถึงเขียน draft 1 แบบ continuous batches อัปเดต continuity/README/index ระหว่างทาง ให้ล็อก assumption ที่สมเหตุสมผลเอง รวมถึงตั้ง project slug จากชื่อเรื่องได้ถ้าไม่ได้ให้มา หากพบปัญหา continuity โครงสร้าง หรือความยาว ให้ตัดสินใจซ่อม ปรับ assumption หรือปรับเป้าหมายเองแล้วเดินต่อจนจบ ใน run-through mode ห้ามจบข้อความด้วยคำถามเชิงอนุมัติหรือถามผู้ใช้ว่าต้องการให้ทำต่อไหม Quality Gate System: เมื่อจบแต่ละขั้นหลัก (draft 1 / rewrite / final audit / polish) ให้ตรวจผลลัพธ์จริงก่อนเดินต่อ โดยต้องตรวจอย่างน้อย: 1) prose ทุกตอนเป็นเหตุการณ์จริง ไม่ใช่ editorial commentary หรือ template ที่ซ้ำข้ามตอน 2) ทุกตอนมี direct dialogue อย่างน้อย 3 ช่วง 3) สำหรับ `ep-01` ย่อหน้าแรกต้องผ่าน `AI world-opening review` ชัดพอให้รู้ว่าผู้อ่านกำลังเข้าสู่โลกนิยายแบบไหน 4) `tools/check-world-opening.mjs` ใช้ได้เป็นแค่ supporting heuristic; ถ้า PASS แต่ AI review ยัง FAIL ให้ถือว่าไม่ผ่าน 5) จำนวนคำรายตอนอยู่ในช่วงเป้าหมายของ metadata ถ้ายังไม่ผ่านต้องขยาย/กระชับตอนนั้นแล้วตรวจซ้ำจนผ่าน 6) คุณภาพไม่ตกลงอย่างเห็นได้ชัดระหว่าง batch แรกกับ batch สุดท้าย ถ้าพบว่าไม่ผ่าน ให้ย้อนกลับไปแก้ขั้นนั้นก่อนเดินต่อ สูงสุด 2 รอบต่อการแก้ย่อยหนึ่งครั้ง สำหรับนิยายที่มีมากกว่า 20 ตอน ให้สร้าง internal recap ทุก 10 ตอน เพื่อสรุปเหตุการณ์ สถานะตัวละคร และ open loops ไว้เป็น reference ก่อนเขียน batch ถัดไป ป้องกัน context loss ที่ทำให้ตอนหลังคุณภาพตก"