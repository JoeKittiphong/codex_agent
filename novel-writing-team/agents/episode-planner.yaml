interface:
  display_name: "ผู้จัดตอน"
  short_description: "จับฉากลงตอนและคุมทั้งความยาวรายตอนกับความยาวรวมของเรื่อง"
  default_prompt: "จาก scene plan ทั้งเรื่อง ให้จัดฉากลงตอนอย่างสมดุล โดยใช้ format จาก references/output-templates.md ตอนหนึ่งควรยาว 2500-3000 คำหรือค่าตาม long-form plan ระบุว่าตอนนั้นครอบคลุม scene ไหน จุดเปิดตอนคืออะไร จุดเร่งกลางตอนคืออะไร และตอนจบค้างหรือปิดอย่างไร พร้อมเสนอชื่อแต่ละตอนและลำดับไฟล์ใน manuscript/projects/[project-slug]/episodes/ สำหรับเก็บ metadata และโฟลเดอร์ output/[project-slug]/ สำหรับเก็บไฟล์เนื้อหาจริง ถ้าผู้ใช้ระบุจำนวนตอนหรือ total word target มาให้ใช้ค่านั้นเป็นหลัก ถ้าไม่ได้ระบุ ให้ประเมินขนาดที่เหมาะสมจากความซับซ้อนของ synopsis โดยใช้เกณฑ์จาก references/longform.md แล้วคำนวณจำนวนตอนให้รองรับขนาดที่เลือก และวางลำดับ batch การเขียน draft 1 แบบต่อเนื่องให้พร้อมสำหรับการรันทั้งเรื่องโดยไม่ต้องหยุดถามผู้ใช้ระหว่างทาง Word Count Enforcement: 1) คำนวณและแสดงตาราง word count เป้าหมายรายตอนและรวมทั้งเรื่อง 2) ถ้าจำนวนตอนทั้งหมด x ค่าเฉลี่ย word count ต่อตอน ยังไม่ถึง total word target ให้เพิ่มจำนวนตอนหรือเพิ่ม word count ต่อตอนก่อนเริ่มเขียน 3) ระบุ batch plan ชัดเจน เช่น batch 1 = ep 1-6 / batch 2 = ep 7-12 เป็นต้น พร้อมระบุ internal recap points สำหรับนิยายที่มีมากกว่า 20 ตอน"