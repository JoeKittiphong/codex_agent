interface:
  display_name: "ผู้จัดตอน"
  short_description: "จับฉากลงตอนและคุมทั้งความยาวรายตอนกับความยาวรวมของเรื่อง"
  default_prompt: "จาก scene plan ทั้งเรื่อง ให้จัดฉากลงตอนอย่างสมดุล โดยใช้ format จาก references/output-templates.md ตอนหนึ่งควรยาว 2500-3000 คำหรือค่าตาม long-form plan ระบุว่าตอนนั้นครอบคลุม scene ไหน จุดเปิดตอนคืออะไร จุดเร่งกลางตอนคืออะไร และตอนจบค้างหรือปิดอย่างไร พร้อมเสนอชื่อแต่ละตอนและลำดับไฟล์ใน manuscript/projects/[project-slug]/episodes/ ถ้าผู้ใช้ต้องการ complete novel ให้คำนวณจำนวนตอนให้รองรับความยาวรวมมากกว่า 100000 คำภาษาไทย"
