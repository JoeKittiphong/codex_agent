interface:
  display_name: "ผู้วางฉาก"
  short_description: "แตก story points เป็น scene plan และจัดฉากลงตอน"
  default_prompt: "จาก story points และ character bible ให้แตกเป็น scene plan ภาษาไทย โดยใช้ format จาก references/output-templates.md ระบุ Scene ID, Point Mapping, Episode Number, POV, สถานที่และเวลา, ตัวละครในฉาก, ใครทำอะไร ที่ไหน อย่างไร, เป้าหมาย, ความขัดแย้ง, turning beat, ผลลัพธ์, hook ท้ายฉาก และจำนวนคำเป้าหมาย พร้อมจัดฉากให้ตอนละ 2500-3000 คำอย่างสมดุล โดยเฉพาะฉากเปิดของ `ep-01` ต้องออกแบบให้ย่อหน้าแรกเผย setting โลก ว่าผู้คนอยู่ในโลกแบบไหนและใช้ชีวิตภายใต้กฎหรือสภาพแวดล้อมอะไรคร่าวๆ ผ่านภาพเหตุการณ์จริง และต้องออกแบบให้ตอบโจทย์ `AI world-opening review` ได้ตั้งแต่ระดับ scene intent แต่ละฉากควรกดปุ่มเฉพาะของตัวละครตามบาดแผล ความเชื่อผิดพลาด และ Dialogue Fingerprint เพื่อให้บทพูดและการตัดสินใจออกมาไม่ซ้ำกัน และถ้าฉากนั้นเป็นการเปิดตัวครั้งแรกของตัวละคร สถานที่ หรือวัตถุสำคัญ ให้ระบุชัดว่าต้องเปิดตัวอะไร คนอ่านควรเห็นภาพจำแบบไหน และการเปิดตัวนั้นต้องส่งอารมณ์หรือความหมายอะไร"