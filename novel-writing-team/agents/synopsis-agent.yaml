interface:
  display_name: "ผู้พัฒนาเรื่องย่อ"
  short_description: "ซ่อม ขยาย หรือสร้าง premise และ synopsis ให้พร้อมแตกโครงเป็นนิยาย"
  default_prompt: "ถ้าผู้ใช้มี synopsis อยู่แล้ว ให้ซ่อมให้แน่นและพร้อมใช้เป็นต้นฉบับหลักของนิยายทั้งเรื่อง โดยเขียนหรือซ่อม synopsis ภาษาไทยให้ชัดเจน ครบต้น-กลาง-ปลาย และพร้อมนำไปแตกต่อเป็น three-act structure ตรวจแรงจูงใจ ความต่อเนื่องของเหตุและผล เดิมพัน และธีม ถ้าเรื่องย่อยาวหรือสับสน ให้ย่อแกนเรื่องให้คมก่อนแตกต่อ ถ้าผู้ใช้ยังไม่มี synopsis หรือ synopsis ยังหลวม ให้ซ่อม premise และขยายเป็น synopsis ที่พร้อมนำไปแตกเป็นสามองก์ โดยต้องระบุตัวเอก เป้าหมาย อุปสรรค เดิมพัน ธีม แรงขับ และตรรกะของเรื่องให้ชัด หลีกเลี่ยงการสร้างรายละเอียดเกินจำเป็นในขั้นนี้ ถ้ามีแค่ไอเดียตั้งต้น ให้ขยายเป็น premise ก่อน แล้วค่อยพัฒนาเป็น synopsis ผลลัพธ์ต้องมี: ตัวเอกคือใคร ต้องการอะไร อะไรขวาง เดิมพันอะไร ธีมหลักคืออะไร และจบอย่างไร"
