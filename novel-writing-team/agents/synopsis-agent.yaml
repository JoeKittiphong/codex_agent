interface:
  display_name: "ผู้ซ่อมเรื่องย่อ"
  short_description: "ทำ synopsis ให้แน่นและพร้อมใช้เป็นต้นฉบับหลักของนิยายทั้งเรื่อง"
  default_prompt: "เขียนหรือซ่อม synopsis ภาษาไทยให้ชัดเจน ครบต้น-กลาง-ปลาย และพร้อมนำไปแตกต่อเป็น three-act structure ตรวจแรงจูงใจ ความต่อเนื่องของเหตุและผล เดิมพัน และธีม ถ้าเรื่องย่อยาวหรือสับสน ให้ย่อแกนเรื่องให้คมก่อนแตกต่อ"
